<div class="container-fluid">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        <div class="card">
          <div class="card-body">
            <h2 class="text-center mb-4">Inscription</h2>
  
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
              <div class="mb-3">
                <label for="username" class="form-label">Nom</label>
                <input type="text" 
                       formControlName="user_name"
                       class="form-control"
                       [ngClass]="{ 'is-invalid': submitted && username.errors }"
                       id="name"/>
                <div *ngIf="submitted && username.errors" class="invalid-feedback">
                  <div *ngIf="username.errors['required']">Le nom est requis</div>
                </div>
              </div>
  
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" 
                       formControlName="email"
                       class="form-control"
                       [ngClass]="{ 'is-invalid': submitted && email.errors }"
                       id="email"/>
                <div *ngIf="submitted && email.errors" class="invalid-feedback">
                  <div *ngIf="email.errors['required']">L'email est requis</div>
                  <div *ngIf="email.errors['email']">L'email n'est pas valide</div>
                </div>
              </div>
  
              <div class="mb-3">
                <label for="password" class="form-label">Mot de passe</label>
                <div class="input-group">
                  <input [type]="showPassword ? 'text' : 'password'"
                         formControlName="password"
                         class="form-control"
                         [ngClass]="{ 'is-invalid': submitted && password.errors }"
                         id="password"/>
                  <button type="button" 
                          class="btn btn-outline-secondary" 
                          (click)="togglePasswordVisibility()">
                    <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                  </button>
                </div>
                <div *ngIf="submitted && password.errors" class="invalid-feedback">
                  <div *ngIf="password.errors['required']">Le mot de passe est requis</div>
                  <div *ngIf="password.errors['minlength']">Le mot de passe doit contenir au moins 6 caractères</div>
                </div>
              </div>
  
              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
                <div class="input-group">
                  <input [type]="showConfirmPassword ? 'text' : 'password'"
                         formControlName="confirm_password"
                         class="form-control"
                         [ngClass]="{ 'is-invalid': submitted && (confirmPassword.errors || registerForm.hasError('mismatch')) }"
                         id="confirmPassword"/>
                  <button type="button" 
                          class="btn btn-outline-secondary" 
                          (click)="toggleConfirmPasswordVisibility()">
                    <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                  </button>
                </div>
                <div *ngIf="submitted && (confirmPassword.errors || registerForm.hasError('mismatch'))" class="invalid-feedback">
                  <div *ngIf="confirmPassword.errors?.['required']">La confirmation du mot de passe est requise</div>
                  <div *ngIf="registerForm.hasError('mismatch')">Les mots de passe ne correspondent pas</div>
                </div>
              </div>
  
              <div class="d-grid gap-2">
                <button class="btn btn-secondary-custom" type="submit" [disabled]="loading">
                  <span class="spinner-border spinner-border-sm me-1" *ngIf="loading"></span>
                  Suscribe
                </button>
                <a class="btn btn-link" routerLink="/login">Déjà inscrit ?</a>
              </div>
  
              <div class="alert alert-danger mt-3" *ngIf="error">
                {{error}}
              </div>
            </form>
  
          </div>
        </div>
      </div>
    </div>
  </div>
