<mat-dialog-title class="dialog-header" [@fadeIn]>
    {{ title }}
</mat-dialog-title>
<mat-dialog-content class="dialog-body" [@fadeIn]>
    <ng-content></ng-content>
</mat-dialog-content>
<mat-dialog-actions align="end" class="buttons-container" [@fadeIn]>
    <!-- Cancel = neutre, Submit = action primaire : même hiérarchie
         constructif/neutre que le bouton de soumission d'auth-form.component.html
         (var(--btn-primary-bg)), au lieu de l'ancien Cancel en --text-danger
         qui donnait plus de poids visuel à l'annulation qu'à la validation. -->
    <app-button [icon]="'cancel'" [label]="cancelLabel" (buttonClickedEvent)="onCancel()" [color]="'var(--btn-secondary-text)'"
        [type]="'custom-button'" [backgroundColor]="'var(--btn-secondary-bg)'" [disabled]="false">
    </app-button>

    <app-button [icon]="submitIcon" [label]="submitLabel" (buttonClickedEvent)="onSubmit()" [color]="'var(--btn-primary-text)'"
        [type]="'custom-button'" [backgroundColor]="danger ? 'var(--text-danger)' : 'var(--btn-primary-bg)'" [disabled]="isFormInvalid()" [submit]="true">
    </app-button>

</mat-dialog-actions>
