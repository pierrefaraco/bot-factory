<div class="help-container">
  <h1>Centre d'aide</h1>
  
  <div class="sections">
    <div class="section" *ngFor="let section of sections">
      <div class="section-icon">
        <i [class]="section.icon"></i>
      </div>
      <h2>{{ section.title }}</h2>
      <p [innerHTML]="section.content"></p>
    </div>
  </div>
</div>
