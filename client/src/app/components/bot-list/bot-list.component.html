<div class="container" [ngClass]="'layout-' + layout">

  <div *ngFor="let bot of botsList" [ngClass]="selected_bot?.id === bot.id? 'selected':'not-selected'">
    <div class="avatar-container"
         (click)="onSelectBot(bot.id)"
         (keydown.enter)="onSelectBot(bot.id)"
         (keydown.space)="onSelectBot(bot.id); $event.preventDefault()"
         tabindex="0"
         role="button"
         [title]="bot.bot_parameters?.bot_name || ('Bot ' + bot.id)"
         [attr.aria-label]="'Select bot ' + (bot.bot_parameters?.bot_name || bot.id)">
      <app-svg-avatar *ngIf="bot.avatar" [avatar]="bot.avatar" ></app-svg-avatar>
    </div>

  </div>
</div>
