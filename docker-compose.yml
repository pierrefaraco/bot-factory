services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: botfactory-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-botcraft}
      MYSQL_USER: ${MYSQL_USER:-botcraft_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456789}
    ports:
      # Bound to loopback only: MySQL has no business being reachable from
      # outside the host, in dev or in prod (see deploy/README.md).
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - botfactory-network

  # ChromaDB Vector Database
  chromadb:
    image: chromadb/chroma:0.5.20
    container_name: botfactory-chromadb
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      # Bound to loopback only, same reasoning as the "db" service above.
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - botfactory-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v2/heartbeat || exit 1"]
      timeout: 10s
      retries: 5
      start_period: 10s

  # Python FastAPI Backend
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: botfactory-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-botcraft_user}:${MYSQL_PASSWORD:-123456789}@${MYSQL_HOST:-db}:3306/${MYSQL_DATABASE:-botcraft}?charset=utf8mb4
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      CHROMA_CONTAINER: ${CHROMA_CONTAINER:-true}
      CHROMA_HOST: ${CHROMA_HOST:-chromadb}
      CHROMA_PORT: ${CHROMA_PORT:-8000}
      PERSIST: ${PERSIST:-true}
      PERSIST_DIRECTORY: ${PERSIST_DIRECTORY:-chroma_db_2}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-1024}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-150}
      RAG_RETRIEVER_K: ${RAG_RETRIEVER_K:-12}
      LOGGER_LVL: ${LOGGER_LVL:-INFO}
      OPERATIONAL_LOG_FILE: ${OPERATIONAL_LOG_FILE:-ai-server.log}
      SUPER_ADMIN_LOGIN: ${SUPER_ADMIN_LOGIN:-pierre.faraco@gmail.com}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-123}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-a}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-medium}
      TOKEN_LIMIT_PER_USER_24H: ${TOKEN_LIMIT_PER_USER_24H:-0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-913568537440-clfeb4jvitdh7111s1j8cv6u8gb6t3dv.apps.googleusercontent.com}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${WEB_PORT:-8080}}
      DEMO_ACCOUNT_EMAIL: ${DEMO_ACCOUNT_EMAIL:-}
    ports:
      # Bound to loopback only: in prod, the "reverse-proxy" service
      # (docker-compose.prod.yml) is the sole public entry point, reaching
      # this through the Docker network -- not through the published port.
      - "127.0.0.1:4444:8000"
    volumes:
      # Embedding model files (2.2 GB for multilingual-e5-large), downloaded
      # on the first startup only: without this volume they would live in the
      # container's /tmp and be downloaded again on every container recreation.
      - fastembed_cache:/home/appuser/.cache/fastembed
    # volumes:
    #   # HOST_PROJECT_PATH: absolute path of this project as seen by the Docker
    #   # daemon. Needed when compose runs inside a dev-container whose paths
    #   # differ from the host's (e.g. /home/devuser/workspace vs /mnt/c/...).
    #   - ${HOST_PROJECT_PATH:-.}/server/src:/app/src
    #   - ${HOST_PROJECT_PATH:-.}/server/db:/app/db
    networks:
      - botfactory-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      timeout: 10s
      retries: 5
      # Long enough for the very first startup, which downloads the embedding
      # model (2.2 GB) before serving; later startups only load it from
      # the fastembed_cache volume (~10-20 s). "healthy" as soon as a check passes.
      start_period: 600s

  # Angular Frontend
  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: botfactory-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # "api" targets the Docker-Compose backend; set to "host.docker.internal"
      # to reach a backend run locally via server/z-run.sh instead.
      API_HOST: ${API_HOST:-api}
      # Same value as the "api" service's GOOGLE_CLIENT_ID -- baked into the
      # static bundle at container start (see client/Dockerfile, assets/env.js).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-913568537440-clfeb4jvitdh7111s1j8cv6u8gb6t3dv.apps.googleusercontent.com}
    ports:
      # Bound to loopback only, same reasoning as "api" above.
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    networks:
      - botfactory-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      timeout: 10s
      retries: 5

volumes:
  mysql_data:
  chroma_data:
  fastembed_cache:

networks:
  botfactory-network:
    driver: bridge
