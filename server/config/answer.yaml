used_sources:
  - label: "only context"
    description: "Answer only from the retrieved context. If the context does not contain the answer, say so clearly instead of using outside knowledge."
  - label: "only outside context"
    description: "Do not use the retrieved context: answer only from your own general knowledge."
  - label: "inside and outside context"
    description: "Answer primarily from the retrieved context. When the context is not enough, you may complete it with your own general knowledge, making clear what comes from the documents and what does not."

context_type:
  - label: "your memories"
    description: "The retrieved context elements contain a part of your memories."
  - label: "Your fiction book"
    description: "The retrieved context elements contain a part of a fiction book."
  - label: "A story"
    description: "The retrieved context elements contain a part of a story."
  - label: "Technical documentation"
    description: "The retrieved context elements contain a part of technical documentation."
  - label: journal
    description: "The retrieved context elements contain a part of your diary."
  - label: "manual"
    description: "The retrieved context elements contain a part of a manual with useful information."
  - label: "role-play guide"
    description: "The retrieved context elements contain a part of a role-play guide."

answer_style:
  - label: informative
    description: "factual and objective, presenting information clearly."
  - label: conversational
    description: "natural and engaging, like in a conversation."
  - label: technical
    description: "precise and detailed, using appropriate technical terminology."
  - label: simplified
    description: "simplified and accessible, explaining technical concepts in simple terms."
  - label: mytho
    description: "embellished and boastful, arranged to your advantage with the aim of impressing the interlocutor."
  - label: comical
    description: "far-fetched and humorous, with the aim of making the interlocutor laugh."

answer_format:
  - label: paragraphs
    description: "The answer must be in structured and logical paragraphs."
  - label: bullet_list
    description: "The answer must be in bullet points to facilitate reading."
  - label: numbered_steps
    description: "The answer must be in sequential numbered steps."
  - label: table
    description: "The answer must be in a table to compare information if relevant."

answer_length:
  - label: very-short
    description: "It's very important that you give a very short answer (about 1-20 words)."
  - label: short
    description: "It's very important that you give a short answer (about 100-150 words)."
  - label: medium
    description: "It's very important that you give a concise but complete answer (about 200-300 words)."
  - label: long
    description: "It's very important that you give a detailed and in-depth answer (about 400-600 words)."
  - label: exhaustive
    description: "It's very important that you give a complete answer covering all important aspects (600+ words)."
  - label: adaptive
    description: "Give productive and complete answers, but adapt their length to the complexity of the question and the amount of relevant context."
