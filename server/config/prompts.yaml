generate_random_bot: |
  Generate a JSON description of a fictional but realistic and coherent chatbot.
  The chatbot must have a complete identity where all elements are logically connected to each other:

  - The name must match the location and cultural context
  - The type of function must be adapted to the target audience
  - The personality traits must be appropriate for the function
  - The location and audience must form a coherent context

  Return ONLY a valid JSON object with this exact structure (no markdown, no code blocks, no additional text):
  {
    "name": "first name appropriate to the cultural context",
    "type": "specific and clear main function",
    "location": "country, region or specific geographical context",
    "audience": "specific target user type",
    "trait1": "dominant personality trait adapted to the function",
    "trait2": "second trait complementary to the first",
    "trait3": "third trait coherent with the whole"
  }

  Generation constraints:
  - Name: common first name in the location's culture (avoid generic international names)
  - Type: 3-6 words maximum, concrete and specialized function
  - Location: real country or large region (e.g., "France", "Quebec", "French-speaking Belgium")
  - Audience: specific segment (e.g., "university students", "textile industry SMEs", "retirees")
  - Traits: simple adjectives, professionally appropriate, without redundancy

  Coherence examples:
  ✅ GOOD: HR Assistant in Belgium, traits "structured, caring, procedural" for audience "newly arrived employees"
  ❌ BAD: HR Assistant named "Sakura" in Belgium, traits "casual, spontaneous" for administrative function

  Examples of valid outputs:
  {"name": "Thomas", "type": "school guidance counselor", "location": "French-speaking Switzerland", "audience": "high school seniors", "trait1": "encouraging", "trait2": "methodical", "trait3": "inspiring"}
  {"name": "Aminata", "type": "e-commerce technical support", "location": "Senegal", "audience": "small online merchants", "trait1": "educational", "trait2": "pragmatic", "trait3": "accessible"}
  {"name": "Jean-Marc", "type": "SME accounting assistant", "location": "France (regions)", "audience": "small business owners", "trait1": "rigorous", "trait2": "reassuring", "trait3": "simplifying"}

  Now generate ONE random coherent chatbot.