generate_random_bot: |
  Generate a JSON description of a fictional but realistic and coherent chatbot.
  The chatbot must have a complete identity where all elements are logically connected:

  - The name must match the location and cultural context
  - The function type must fit the target audience
  - The personality traits must be appropriate for the function
  - The location and audience must form a coherent context

  Return ONLY a valid JSON object with this exact structure (no markdown, no code blocks, no additional text):
  {
    "name": "first name appropriate to the cultural context",
    "type": "specific and clear main function",
    "location": "specific country, region or geographic context",
    "audience": "specific target user type",
    "trait1": "dominant personality trait suited to the function",
    "trait2": "second trait complementary to the first",
    "trait3": "third trait consistent with the whole"
  }

  Generation constraints:
  - Name: a common first name in the culture of the location (avoid generic international names)
  - Type: 3-6 words maximum, concrete and specialized function
  - Location: a real country or large region (e.g. "France", "Quebec", "Scotland")
  - Audience: a specific segment (e.g. "university students", "textile SMEs", "retirees")
  - Traits: simple adjectives, professionally appropriate, without redundancy

  MAXIMUM DIVERSITY REQUIRED:
  - Explore varied sectors (health, agriculture, arts, sports, technology, tourism, education, justice, environment, finance, media, transport, crafts, gastronomy, etc.)
  - Vary the regions across the whole world (Europe, North and South America, Africa, Asia, Oceania, islands and overseas territories)
  - Change the audience types (ages, professions, statuses, various contexts)
  - Use authentic, less common first names from each culture

  Examples of the diversity expected:
  {"name": "Loic", "type": "mediator for co-owned buildings", "location": "Brittany", "audience": "residential building managers", "trait1": "diplomatic", "trait2": "fair", "trait3": "conciliatory"}
  {"name": "Fatoumata", "type": "organic farming trainer", "location": "Burkina Faso", "audience": "rural women's cooperatives", "trait1": "pedagogical", "trait2": "down-to-earth", "trait3": "respectful"}
  {"name": "Dimitri", "type": "vocal coach for actors", "location": "Belgium", "audience": "drama students", "trait1": "demanding", "trait2": "attentive", "trait3": "stimulating"}
  {"name": "Nathalie", "type": "public cybersecurity analyst", "location": "Luxembourg", "audience": "municipal administrations", "trait1": "vigilant", "trait2": "clear", "trait3": "forward-thinking"}

  IMPORTANT: NEVER repeat the same combinations. On each generation, significantly change AT LEAST 5 of the 7 elements. Favor originality and creativity while maintaining internal coherence.

  Now generate ONE coherent chatbot that is totally unique and different from all the examples above.
